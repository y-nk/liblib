name: Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: android
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/credentials/liblib-release.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 552497043706-993mhqs778e3cu1h5i5ovjkl0ue9ncmb.apps.googleusercontent.com
      GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.552497043706-68p2ailtcllhe79c485so0v8rdc1bc79
    steps:
      - run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/**/*.gradle*', 'app/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - run: pnpm install --frozen-lockfile

      - name: Decode release keystore
        working-directory: app
        run: |
          mkdir -p credentials
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "keystore decode failed"; exit 1; }

      - run: pnpm --filter liblib exec expo prebuild --clean --platform android --no-install

      - name: Build signed release APK
        working-directory: app/android
        run: |
          ./gradlew assembleRelease -quiet \
            "-Pandroid.injected.signing.store.file=$ANDROID_KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
        env:
          EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}

      - name: Shred keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: app-release.apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

      - if: always()
        run: |
          DURATION=$(( $(date +%s) - BUILD_START ))
          MINS=$(( DURATION / 60 ))
          SECS=$(( DURATION % 60 ))
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="Android build ready"
            TAGS="white_check_mark,android"
            CLICK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
            BODY="Build ${GITHUB_SHA::7} finished in ${MINS}m${SECS}s."
          else
            TITLE="Android build failed"
            TAGS="x,android"
            CLICK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BODY="Build ${GITHUB_SHA::7} failed after ${MINS}m${SECS}s."
          fi
          curl -s \
            -H "Title: $TITLE" \
            -H "Tags: $TAGS" \
            -H "Click: $CLICK" \
            -d "$BODY" \
            https://ntfy.sh/liblib-build
